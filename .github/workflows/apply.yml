# Apply. Runs on every push to main (every merged PR) and by hand (Actions > apply > Run workflow).
#
# The stages go IN SERIES. Each group below is planned and applied before the next one is planned, so a later
# stage always sees the outputs of the earlier ones, and one run can build everything from scratch:
#
#   1-org > 2-security > 3-networks shared (hub) > 3-networks dev/qa/prod > 4-projects shared > 4-projects
#   dev/qa/prod > 5-workloads shared > 5-workloads dev/qa/prod
#
# Each group is terraform-group.yml: plan every root of the group as the stage's service account (conftest +
# run summary), then apply the roots with changes in their GitHub environment, after its reviewers approve the
# saved plan. A group with no roots, or no changes, finishes at once. If a group fails, the later ones do not run.
#
# A merge (push to main) has no fields: it plans every root and applies the ones with changes, in series.
# Run workflow has two optional fields:
#   up to stage: leave it at 5-workloads (default) to plan and apply everything that is merged. A run with nothing
#                new is the "second plan, zero changes" check. Pick 3-networks to bring up only the network (for
#                example after destroy.yml) without paying for 4 and 5.
#   env:         all (default), or only dev, qa or prod. The shared roots (1-org, 2-security, envs/shared) are
#                always planned, because the environments depend on them; shared = only those.
name: apply

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      up_to:
        description: Last stage to plan and apply (the stages after it are skipped).
        type: choice
        default: 5-workloads
        options: [1-org, 2-security, 3-networks, 4-projects, 5-workloads]
      env:
        description: Environment (all = dev, qa and prod). The shared roots are always included; shared = only them.
        type: choice
        default: all
        options: [all, dev, qa, prod, shared]

permissions:
  contents: read

# Never run two applies (or an apply and a destroy) at the same time. A newer run waits; it is not cancelled.
concurrency:
  group: apply-main
  cancel-in-progress: false

jobs:
  org:
    uses: ./.github/workflows/terraform-group.yml
    permissions:
      contents: read
      id-token: write
    secrets: inherit
    with:
      stage: 1-org
      scope: shared

  security:
    needs: org
    if: github.event_name != 'workflow_dispatch' || inputs.up_to != '1-org'
    uses: ./.github/workflows/terraform-group.yml
    permissions:
      contents: read
      id-token: write
    secrets: inherit
    with:
      stage: 2-security
      scope: shared

  networks-shared:
    needs: security
    if: github.event_name != 'workflow_dispatch' || contains(fromJSON('["3-networks","4-projects","5-workloads"]'), inputs.up_to)
    uses: ./.github/workflows/terraform-group.yml
    permissions:
      contents: read
      id-token: write
    secrets: inherit
    with:
      stage: 3-networks
      scope: shared

  networks-envs:
    needs: networks-shared
    uses: ./.github/workflows/terraform-group.yml
    permissions:
      contents: read
      id-token: write
    secrets: inherit
    with:
      stage: 3-networks
      scope: envs
      env: ${{ inputs.env || 'all' }}

  projects-shared:
    needs: networks-envs
    if: github.event_name != 'workflow_dispatch' || contains(fromJSON('["4-projects","5-workloads"]'), inputs.up_to)
    uses: ./.github/workflows/terraform-group.yml
    permissions:
      contents: read
      id-token: write
    secrets: inherit
    with:
      stage: 4-projects
      scope: shared

  projects-envs:
    needs: projects-shared
    uses: ./.github/workflows/terraform-group.yml
    permissions:
      contents: read
      id-token: write
    secrets: inherit
    with:
      stage: 4-projects
      scope: envs
      env: ${{ inputs.env || 'all' }}

  workloads-shared:
    needs: projects-envs
    if: github.event_name != 'workflow_dispatch' || inputs.up_to == '5-workloads'
    uses: ./.github/workflows/terraform-group.yml
    permissions:
      contents: read
      id-token: write
    secrets: inherit
    with:
      stage: 5-workloads
      scope: shared

  workloads-envs:
    needs: workloads-shared
    uses: ./.github/workflows/terraform-group.yml
    permissions:
      contents: read
      id-token: write
    secrets: inherit
    with:
      stage: 5-workloads
      scope: envs
      env: ${{ inputs.env || 'all' }}
